          description: The ID of the store that submitted the data.
        dataType:
          type: string
          enum: [purchase, search]
          description: The type of data submitted.
        timestamp:
          type: string
          format: date-time
          description: When the data was submitted to Tapiro.
        entryTimestamp:
          type: string
          format: date-time
          description: The timestamp of the original event (e.g., purchase time).
        details:
          type: object
          description: Simplified details (e.g., item count for purchase, query string for search)

