      additionalProperties:
        type: object # Example: { "YYYY-MM": { "Category1": 100, "Category2": 50 } }
        additionalProperties:
          type: number
          format: float
      example:
        "2025-01": { "Electronics": 1299.99, "Clothing": 150.5 }
        "2025-02": { "Clothing": 100, "Home": 85 }

    StoreBasicInfo:
      type: object
      properties:
