          type: string
          description: Additional error details if available

    PingStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time

    UserMetadataResponse:
      type: object
      properties:
        updated:
          type: boolean
          description: Whether metadata was updated successfully
        metadata:
          type: object
          properties:
            registrationType:
              type: string
              enum: [user, store]
              description: The type of registration
            registrationComplete:
              type: boolean
              description: Whether registration process is complete
            nickname:
              type: string
              description: User or store display name

    TaxonomyAttribute:
      type: object
      description: Attribute within a taxonomy category
      required:
        - name
        - values
      properties:
        name:
          type: string
        values:
          type: array
          items:
            type: string
        description:
          type: string
          nullable: true

    TaxonomyCategory:
      type: object
      description: Category within a taxonomy system
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyAttribute"
          default: []

    Taxonomy:
      type: object
      description: Complete taxonomy definition with categories and version
      required:
        - categories
        - version
      properties:
        _id:
          type: string
          readOnly: true
        categories:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyCategory"
        version:
          type: string

    DemographicData:
      type: object
      description: User-provided and inferred demographic information
      properties:
        # --- User-Provided ---
        gender:
          type: string
          nullable: true
          description: "User-provided gender identity"
          enum: [male, female, non-binary, prefer_not_to_say, null]
          example: "female"
        incomeBracket:
          type: string
          nullable: true
          description: "User-provided income bracket category"
          enum:
            [
              "<25k",
              "25k-50k",
              "50k-100k",
              "100k-200k",
              ">200k",
              "prefer_not_to_say",
              null,
            ]
          example: "50k-100k"
        country:
          type: string
          nullable: true
          description: "User-provided country of residence (e.g., ISO 3166-1 alpha-2 code)"
          example: "US"
        age:
          type: integer
          format: int32
          nullable: true
          description: "User-provided age"
          example: 35
          minimum: 0
        hasKids: # NEW User-provided
          type: boolean
          nullable: true
          description: "User-provided: Does the user have children?"
          example: true
        relationshipStatus: # NEW User-provided
          type: string
          nullable: true
          description: "User-provided: User relationship status"
          enum: [single, relationship, married, prefer_not_to_say, null]
          example: "married"
        employmentStatus: # NEW User-provided
          type: string
          nullable: true
          description: "User-provided: User employment status"
          enum: [employed, unemployed, student, prefer_not_to_say, null]
          example: "employed"
        educationLevel: # NEW User-provided
          type: string
          nullable: true
          description: "User-provided: User education level"
          enum:
            [
              high_school,
              bachelors,
              masters,
              doctorate,
              prefer_not_to_say,
              null,
            ]
          example: "bachelors"
        # --- Inferred (Read-Only in responses, not updatable directly) ---
        inferredHasKids:
          type: boolean
          nullable: true
          readOnly: true
          description: "Inferred: Does the user likely have children? (null if unknown or user provided)"
        inferredRelationshipStatus:
          type: string
          nullable: true
          readOnly: true
          description: "Inferred: User relationship status (null if unknown or user provided)"
          enum: [single, relationship, married, null]
        inferredEmploymentStatus:
          type: string
          nullable: true
          readOnly: true
          description: "Inferred: User employment status (null if unknown or user provided)"
          enum: [employed, unemployed, student, null]
        inferredEducationLevel:
          type: string
          nullable: true
          readOnly: true
          description: "Inferred: User education level (null if unknown or user provided)"
          enum: [high_school, bachelors, masters, doctorate, null]
        inferredGender:
          type: string
          nullable: true
          readOnly: true
          description: "Inferred: User gender identity (null if unknown or user provided)"
          enum: [male, female, non-binary, null]

    RecentUserDataEntry:
