openapi: 3.0.0
info:
  title: Tapiro API
  description: API for AI-Driven Personalized Advertising Health
  version: 1.0.0
  contact: { name: Tapiro Support, email: tapirosupport@gmail.com }
tags:
  - name: Authentication
    description: Account registration and authentication operations
  - name: User Management
    description: User profile and data management operations
  - name: Store Management
    description: Store profile, API key, and integration management
  - name: Data Collection
    description: Operations for submitting user data for targeted advertising
  - name: Preference Management
    description: Operations for managing user preferences and opt-in/out settings
  - name: Data Retrival
    description: Operations for retrieving user preferences and data
  - name: Health
    description: Health and uptime monitoring
  - name: Admin
    description: Administrative operations for managing taxonomy and keyword mappings
  - name: Taxonomy
    description: Operations related to the product/interest taxonomy
servers:
  - url: https://virtserver.swaggerhub.com/CHAMATHDEWMINA25/TAPIRO/1.0.0
    description: SwaggerHub API Auto Mocking
  - url: https://api.tapiro.com/v1
    description: Production API
  - url: http://localhost:3000
    description: Development API
paths:
  /users/register:
    post:
      tags: [Authentication]
      summary: Register User
      description: Create a new regular user account
      operationId: registerUser
      security:
        - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
        required: true
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: Authentication

  /stores/register:
    post:
      tags: [Authentication]
      summary: Register Store
      description: Create a new store account
      operationId: registerStore
      security:
        - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreate"
        required: true
      responses:
        "201":
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: Authentication

  /users/profile:
    get:
      tags: [User Management]
      summary: Get User Profile
      description: Get authenticated user's profile
      operationId: getUserProfile
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: UserProfile

    put:
      tags: [User Management]
      summary: Update User Profile
      description: Update authenticated user's profile
      operationId: updateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
        required: true
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:write]
      x-swagger-router-controller: UserProfile

    delete:
      tags: [User Management]
      summary: Delete User Profile
      description: Delete authenticated user's profile
      operationId: deleteUserProfile
      responses:
        "204":
          description: User profile deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:write]
      x-swagger-router-controller: UserProfile

  /stores/profile:
    get:
      tags: [Store Management]
      summary: Get Store Profile
      description: Get authenticated store's profile
      operationId: getStoreProfile
      responses:
        "200":
          description: Store profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:read]
      x-swagger-router-controller: StoreProfile

    put:
      tags: [Store Management]
      summary: Update Store Profile
      description: Update authenticated store's profile
      operationId: updateStoreProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
        required: true
      responses:
        "200":
          description: Store profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:write]
      x-swagger-router-controller: StoreProfile

    delete:
      tags: [Store Management]
      summary: Delete Store Profile
      description: Delete authenticated store's profile
      operationId: deleteStoreProfile
      responses:
        "204":
          description: Store profile deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:write]
      x-swagger-router-controller: StoreProfile

  /users/data:
    post:
      tags: [Data Collection]
      summary: Submit user data
      description: Submit purchase/search history for a user (authenticated via API key)
      operationId: submitUserData
      security:
        - apiKey: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserData"
        required: true
      responses:
        "202":
          description: Data accepted for processing
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: StoreOperations

  /users/{userId}/preferences:
    get:
      tags: [Data Retrival]
      summary: Get user preferences
      description: Retrieve preferences for targeted advertising
      operationId: getUserPreferences
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      security:
        - apiKey: []
      responses:
        "200":
          description: UserPreferences retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: StoreOperations

  /users/preferences:
    get:
      tags: [Preference Management]
      summary: Get user preferences
      description: Get the authenticated user's preferences
      operationId: getUserOwnPreferences
      responses:
        "200":
          description: User preferences retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: PreferenceManagement

    put:
      tags: [Preference Management]
      summary: Update user preferences
      description: Update the user's interest preferences and related settings
      operationId: updateUserPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
        required: true
      responses:
        "200":
          description: Preferences updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:write]
      x-swagger-router-controller: PreferenceManagement

  /users/preferences/opt-in/{storeId}:
    post:
      tags: [Preference Management]
      summary: Opt in to store data collection
      description: Removes a store from the user's opt-out list to allow data collection
      operationId: optInToStore
      parameters:
        - name: storeId
          in: path
          required: true
          description: ID of the store to opt in to
          schema:
            type: string
      responses:
        "204":
          description: Successfully opted in to store
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:write]
      x-swagger-router-controller: PreferenceManagement

  /users/preferences/opt-out/{storeId}:
    post:
      tags: [Preference Management]
      summary: Opt out from store data collection
      description: Adds a store to the user's opt-out list to prevent data collection
      operationId: optOutFromStore
      parameters:
        - name: storeId
          in: path
          required: true
          description: ID of the store to opt out from
          schema:
            type: string
      responses:
        "204":
          description: Successfully opted out from store
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:write]
      x-swagger-router-controller: PreferenceManagement

  /users/preferences/store-consent:
    get:
      tags: [Preference Management]
      summary: Get user's store opt-in/out lists
      description: Retrieves the lists of store IDs the user has explicitly opted into or opted out of sharing data with.
      operationId: getStoreConsentLists
      responses:
        "200":
          description: Successfully retrieved store consent lists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreConsentList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read] # Requires user read scope
      x-swagger-router-controller: PreferenceManagement

  /stores/api-keys:
    post:
      tags: [Store Management]
      summary: Generate new API key
      description: Generates a new API key for the authenticated store
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
        required: false
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:write]
      x-swagger-router-controller: StoreManagement

    get:
      tags: [Store Management]
      summary: List API keys
      description: Returns all active API keys for the store
      operationId: getApiKeys
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:read]
      x-swagger-router-controller: StoreManagement

  /stores/api-keys/{keyId}:
    delete:
      tags: [Store Management]
      summary: Revoke API key
      description: Revokes a specific API key
      operationId: revokeApiKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: API key revoked
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:write]
      x-swagger-router-controller: StoreManagement

  /stores/api-keys/{keyId}/usage:
    post:
      tags: [Store Management]
      summary: Get API key usage statistics
      description: Returns usage data for a specific API key
      operationId: getApiKeyUsage
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date
                  description: Optional start date for filtering usage data
                endDate:
                  type: string
                  format: date
                  description: Optional end date for filtering usage data
        required: false
      responses:
        "200":
          description: API key usage statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyUsage"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [store:read]
      x-swagger-router-controller: StoreManagement

  /stores/api-usage-log:
    get:
      tags: [Store Management]
      summary: Get API usage log
      description: Retrieves a paginated list of detailed API usage logs for the authenticated store, with optional filtering.
      operationId: getApiUsageLog
      security:
        - oauth2: [store:read] # Requires store read scope
      parameters:
        - in: query
          name: keyId
          schema:
            type: string
          required: false
          description: Filter logs by a specific API key ID.
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          required: false
          description: Filter logs from this date (inclusive).
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          required: false
          description: Filter logs up to this date (inclusive).
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          required: false
          description: Page number for pagination.
        - in: query
          name: limit
          schema:
            type: integer
            default: 15
          required: false
          description: Number of logs per page.
      responses:
        "200":
          description: A paginated list of API usage logs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiUsageLogEntry" # Define this schema below
                  pagination:
                    $ref: "#/components/schemas/PaginationInfo" # Define this schema below
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError" # If store not found
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: StoreManagement # Route to StoreManagement controller

  /health:
    get:
      tags: [Health]
      summary: Health Check
      description: Comprehensive health check that verifies API and dependencies
      operationId: healthCheck
      responses:
        "200":
          description: Health status information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: Health

  /ping:
    get:
      tags: [Health]
      summary: Simple Uptime Check
      description: Simple ping endpoint for uptime monitoring
      operationId: ping
      responses:
        "200":
          description: Simple response indicating the API is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingStatus"
      x-swagger-router-controller: Health

  /users/metadata/get:
    get:
      tags: [Authentication]
      summary: Get User Metadata
      description: Retrieve Auth0 metadata for the authenticated user
      operationId: getUserMetadata
      security:
        - oauth2: []
      responses:
        "200":
          description: Metadata retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMetadataResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: Authentication

  /taxonomy/categories:
    get:
      tags: [Taxonomy]
      summary: Get Taxonomy Categories
      description: Retrieves the full taxonomy structure from the database.
      operationId: getTaxonomyCategories
      responses:
        "200":
          description: Successfully retrieved the taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Taxonomy"
        "404":
          description: Taxonomy data not found in the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
      x-swagger-router-controller: Taxonomy

  /users/data/recent:
    get:
      tags: [User Management]
      summary: Get Recent User Data Submissions
      description: Retrieves a list of recent data submissions made about the authenticated user, with optional filtering and searching.
      operationId: getRecentUserData
      parameters:
        - name: limit
          in: query
          description: Maximum number of records to return
          required: false
          schema:
            type: integer
            default: 10
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            default: 1
        - name: dataType
          in: query
          description: Filter by data type (purchase or search)
          required: false
          schema:
            type: string
            enum: [purchase, search]
        - name: storeId
          in: query
          description: Filter by store ID
          required: false
          schema:
            type: string
        - name: startDate
          in: query
          description: Filter by start date (ISO 8601 format YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter by end date (ISO 8601 format YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: searchTerm
          in: query
          description: Search term for entries (e.g., item name, search query)
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Recent user data retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentUserDataEntry"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: UserProfile

  /users/analytics/spending:
    get:
      tags: [User Management]
      summary: Get User Spending Analytics
      description: Retrieves aggregated spending data by category and month for the authenticated user.
      operationId: getSpendingAnalytics
      parameters:
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter results from this date onwards (YYYY-MM-DD).
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Filter results up to this date (YYYY-MM-DD).
      responses:
        "200":
          description: Spending analytics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySpendingAnalytics"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: UserProfile

  /stores/lookup:
    get:
      tags: [Store Management]
      summary: Lookup Store Details
      description: Retrieves basic details (like name) for a list of store IDs.
      operationId: lookupStores
      parameters:
        - name: ids
          in: query
          description: Comma-separated list of store IDs to lookup.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Store details retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreBasicInfo"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: StoreProfile

  /stores/search:
    get:
      tags: [Store Management]
      summary: Search Stores
      description: Searches for stores by name. Requires authentication.
      operationId: searchStores
      parameters:
        - name: query
          in: query
          description: The search term to look for in store names.
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum number of results to return.
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Stores matching the query retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreBasicInfo"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - oauth2: [user:read]
      x-swagger-router-controller: StoreProfile

components:
  schemas:
    AttributeDistribution:
      type: object
      description: Distribution of attribute values (0.0-1.0)
      additionalProperties:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0

    User:
      type: object
      required:
        - email
        - auth0Id
        - privacySettings
      properties:
        userId:
          type: string
          readOnly: true
          description: Internal user ID
        auth0Id:
          type: string
          description: Auth0 user ID
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 15
          pattern: "^[a-zA-Z0-9_-]+$"
        phone:
          type: string
          pattern: ^\+?[\d\s-]+$
        privacySettings:
          $ref: "#/components/schemas/PrivacySettings"
        demographicData:
          $ref: "#/components/schemas/DemographicData"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    PrivacySettings:
      type: object
      properties:
        dataSharingConsent:
          type: boolean
          description: User consent to share aggregated/anonymized data.
        allowInference:
          type: boolean
          description: Allow Tapiro to infer demographic data based on user activity.
          default: true
      required:
        - dataSharingConsent

    Store:
      type: object
      required:
        - name
        - auth0Id
        - address
      properties:
        storeId:
          type: string
          readOnly: true
        auth0Id:
          type: string
          description: Auth0 organization ID
        name:
          type: string
        address:
          type: string
        apiKeys:
          type: array
          items:
            type: string
          description: Hashed API keys
          readOnly: true
        webhooks:
          type: array
          items:
            type: object
            required:
              - url
              - events
            properties:
              url:
                type: string
                format: uri
              events:
                type: array
                items:
                  type: string
                  enum: [purchase, opt-out]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    UserCreate:
      type: object
      required:
        - dataSharingConsent
        - username # Add username to required fields
      properties:
        username: # Add username property
          type: string
          minLength: 3
          maxLength: 15
          pattern: "^[a-zA-Z0-9_-]+$"
          description: User's unique username, chosen during registration.
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceItem"
        dataSharingConsent:
          type: boolean
          description: User's consent for data sharing
        allowInference:
          type: boolean
          description: Allow Tapiro to infer demographic data (defaults to true if omitted).
        gender:
          type: string
          nullable: true
          description: User gender identity
        incomeBracket:
          type: string
          nullable: true
          description: User income bracket category
        country:
          type: string
          nullable: true
          description: User country of residence (ISO 3166-1 alpha-2 code)
        age:
          type: integer
          format: int32
          nullable: true
          description: User age

    StoreCreate:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
        address:
          type: string
        webhooks:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              events:
                type: array
                items:
                  type: string
                  enum: [purchase, opt-out]

    UserUpdate:
      type: object
      properties:
        username:
          type: string
          description: User's unique username
        phone:
          type: string
          description: User's phone number (E.164 format recommended)
          pattern: '^\+?[\d\s-]+$'
        preferences:
          type: array
          description: User interest preferences with taxonomy categorization
          items:
            $ref: "#/components/schemas/PreferenceItem"
        privacySettings:
          $ref: "#/components/schemas/PrivacySettings"
        demographicData:
          type: object
          description: Updatable user-provided demographic information. Setting a value here implies verification and may clear inferred values.
          properties:
            gender:
              type: string
              nullable: true
              description: "User-provided gender identity"
              enum: [male, female, non-binary, prefer_not_to_say, null]
            incomeBracket:
              type: string
              nullable: true
              description: "User-provided income bracket category"
              enum:
                [
                  "<25k",
                  "25k-50k",
                  "50k-100k",
                  "100k-200k",
                  ">200k",
                  "prefer_not_to_say",
                  null,
                ]
            country:
              type: string
              nullable: true
              description: "User-provided country of residence (e.g., ISO 3166-1 alpha-2 code)"
            age:
              type: integer
              format: int32
              nullable: true
              description: "User-provided age. Setting this clears the inferred age bracket."
              minimum: 0
            hasKids:
              type: boolean
              nullable: true
              description: "User-provided: Does the user have children?"
            relationshipStatus:
              type: string
              nullable: true
              description: "User-provided: User relationship status"
              enum: [single, relationship, married, prefer_not_to_say, null]
            employmentStatus:
              type: string
              nullable: true
              description: "User-provided: User employment status"
              enum: [employed, unemployed, student, prefer_not_to_say, null]
            educationLevel:
              type: string
              nullable: true
              description: "User-provided: User education level"
              enum:
                [
                  high_school,
                  bachelors,
                  masters,
                  doctorate,
                  prefer_not_to_say,
                  null,
                ]
            # REMOVED verification flags from update payload

    ApiKey:
      type: object
      properties:
        keyId:
          type: string
          format: uuid
          readOnly: true
        prefix:
          type: string
          readOnly: true
        name:
          type: string
          description: Name for the API key
        createdAt:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          enum: [active, revoked]

    UserData:
      type: object
      required:
        - email
        - dataType # Make dataType required
        - entries
      properties:
        email:
          type: string
          format: email
          description: User's email address (used as identifier for API key auth). Must match a registered Tapiro user.
        dataType:
          type: string
          enum: [purchase, search]
          description: Specifies the type of data contained in the 'entries' array.
        entries:
          type: array
          description: >
            List of data entries. Each entry must conform to either the PurchaseEntry
            or SearchEntry schema, matching the top-level 'dataType'.
          items:
            oneOf: # Use oneOf to specify possible entry types
              - $ref: "#/components/schemas/PurchaseEntry"
              - $ref: "#/components/schemas/SearchEntry"
            description: "An entry representing either a purchase event or a search event."
          minItems: 1 # Require at least one entry
        metadata:
          type: object
          description: Additional metadata about the collection event (e.g., source, device).
          properties:
            source:
              type: string
              description: Source of the data (e.g., 'web', 'mobile_app', 'pos').
            deviceType:
              type: string
              description: Type of device used (e.g., 'desktop', 'mobile', 'tablet').
            sessionId:
              type: string
              description: Identifier for the user's session.
          example:
            source: "web"
            deviceType: "desktop"
            sessionId: "abc-123-xyz-789"
      example: # Example for a purchase submission
        email: "user@example.com"
        dataType: "purchase"
        entries:
          - $ref: "#/components/schemas/PurchaseEntry/example"
        metadata:
          source: "web"
          deviceType: "desktop"
          sessionId: "abc-123-xyz-789"

    PurchaseEntry:
      type: object
      required:
        - timestamp
        - items
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the purchase occurred.
        items:
          type: array
          description: List of items included in the purchase.
          items:
            $ref: "#/components/schemas/PurchaseItem"
        totalValue:
          type: number
          format: float
          description: Optional total value of the purchase event.
      example:
        timestamp: "2024-05-15T14:30:00Z"
        items:
          - $ref: "#/components/schemas/PurchaseItem/example" # Reference the example above
          - sku: "ABC-789"
            name: "Running Shorts"
            category: "201" # Clothing
            price: 39.95
            quantity: 1
            attributes:
              color: "black"
              size: "M"
              material: "polyester"
        totalValue: 91.93

    PurchaseItem:
      type: object
      required:
        - name
        - category # Making category required for better processing
      properties:
        sku:
          type: string
          description: Stock Keeping Unit or unique product identifier.
        name:
          type: string
          description: Name of the purchased item.
        category:
          type: string
          description: >
            Category ID or name matching the Tapiro taxonomy (e.g., "101" or "Smartphones").
            Providing the most specific category ID is recommended.
        price:
          type: number
          format: float
          description: Price of a single unit of the item.
        quantity:
          type: integer
          description: Number of units purchased.
          default: 1
        attributes:
          $ref: "#/components/schemas/ItemAttributes"
      example:
        sku: "XYZ-123"
        name: "Men's Cotton T-Shirt"
        category: "201" # Example: Clothing ID
        price: 25.99
        quantity: 2
        attributes:
          color: "navy"
          size: "M"
          material: "cotton"

    ItemAttributes:
      type: object
      description: >
        Key-value pairs representing product attributes based on the taxonomy.
        Keys should be attribute names (e.g., "color", "size", "brand") and
        values should be the specific attribute value (e.g., "blue", "large", "Acme").
      additionalProperties:
        type: string
      example:
        color: "blue"
        size: "L"
        material: "cotton"

    SearchEntry:
      type: object
      required:
        - timestamp
        - query
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the search occurred.
        query:
          type: string
          description: The search query string entered by the user.
        category:
          type: string
          description: >
            Optional category context provided during the search (e.g., user was browsing 'Electronics').
            Should match a Tapiro taxonomy ID or name.
        results:
          type: integer
          description: Optional number of results returned for the search query.
        clicked:
          type: array
          description: Optional list of product IDs or SKUs clicked from the search results.
          items:
            type: string
      example:
        timestamp: "2024-05-15T10:15:00Z"
        query: "noise cancelling headphones"
        category: "105" # Example: Audio ID
        results: 25
        clicked: ["Bose-QC45", "Sony-WH1000XM5"]

    UserPreferences:
      type: object
      properties:
        userId:
          type: string
          description: Internal user ID
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceItem"
        updatedAt:
          type: string
          format: date-time

    UserPreferencesUpdate:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/PreferenceItem"
          description: User interest preferences with taxonomy categorization

    PreferenceItem:
      type: object
      required:
        - category
        - score
      properties:
        category:
          type: string
          description: Category ID or name (e.g., "101" or "smartphones")
        score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Preference score (0.0-1.0)
        attributes:
          type: object
          description: Category-specific attribute preferences
          properties:
            price_range:
              type: object
              properties:
                budget:
                  type: number
                  format: float
                mid_range:
                  type: number
                  format: float
                premium:
                  type: number
                  format: float
                luxury:
                  type: number
                  format: float
            color:
              $ref: "#/components/schemas/AttributeDistribution"
            brand:
              $ref: "#/components/schemas/AttributeDistribution"
            material:
              $ref: "#/components/schemas/AttributeDistribution"
            style:
              $ref: "#/components/schemas/AttributeDistribution"
            room:
              $ref: "#/components/schemas/AttributeDistribution"
            size:
              $ref: "#/components/schemas/AttributeDistribution"
            feature:
              $ref: "#/components/schemas/AttributeDistribution"
            season:
              $ref: "#/components/schemas/AttributeDistribution"
            gender:
              $ref: "#/components/schemas/AttributeDistribution"

    StoreUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        webhooks:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              events:
                type: array
                items:
                  type: string
                  enum: [purchase, opt-out]

    ApiKeyCreate:
      type: object
      properties:
        name:
          type: string
          description: Name for the API key

    ApiKeyList:
      type: array
      items:
        $ref: "#/components/schemas/ApiKey"

    ApiKeyUsage:
      type: object
      properties:
        keyId:
          type: string
        prefix:
          type: string
        name:
          type: string
        totalRequests:
          type: integer
        methodBreakdown:
          type: object
          additionalProperties:
            type: integer
        endpointBreakdown:
          type: object
          additionalProperties:
            type: integer
        dailyUsage:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer

    StoreConsentList:
      type: object
      properties:
        optInStores:
          type: array
          items:
            type: string
          description: List of store IDs the user has opted into.
        optOutStores:
          type: array
          items:
            type: string
          description: List of store IDs the user has opted out of.

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: Overall health status of the Health
        timestamp:
          type: string
          format: date-time
          description: Time of health check
        service:
          type: string
          description: Service name
        dependencies:
          type: object
          properties:
            database:
              type: string
              enum: [connected, disconnected, degraded]
            cache:
              type: string
              enum: [connected, disconnected, degraded]
            auth:
              type: string
              enum: [connected, disconnected, degraded, unknown]

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code
        message:
          type: string
          description: Error message
