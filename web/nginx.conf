server {
    listen 80;
    server_name localhost; # Adjust if needed for a specific domain

    # Set the root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle SPA routing
    # Try to serve the requested file ($uri), then try it as a directory ($uri/),
    # otherwise fall back to serving /index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve caching for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Optional: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}